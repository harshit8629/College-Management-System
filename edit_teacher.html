{% extends 'base.html' %}
{% block topbar_title %}Edit Teacher{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">
        <span class="title-icon icon-blue"><i class="bi bi-pencil-square"></i></span>
        Edit Teacher
    </h1>
    <a href="{{ url_for('teachers') }}" class="btn btn-outline-primary">
        <i class="bi bi-arrow-left me-1"></i>Back to Teachers
    </a>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="name" value="{{ teacher.name }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" name="email" value="{{ teacher.email }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" value="{{ teacher.phone or '' }}" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Department <span class="text-danger">*</span></label>
                <select name="department_id" class="form-select" required>
                    {% for dept in departments %}
                    <option value="{{ dept.department_id }}"
                        {% if dept.department_id == teacher.department_id %}selected{% endif %}>
                        {{ dept.department_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Designation <span class="text-danger">*</span></label>
                <input type="text" name="designation" value="{{ teacher.designation or '' }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Qualification</label>
                <input type="text" name="qualification" value="{{ teacher.qualification or '' }}" class="form-control">
            </div>
            <div class="col-12 d-flex gap-3">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="bi bi-check-circle me-1"></i>Update Teacher
                </button>
                <a href="{{ url_for('teachers') }}" class="btn btn-outline-primary btn-lg px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
