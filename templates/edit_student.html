{% extends 'base.html' %}
{% block topbar_title %}Edit Student{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">
        <span class="title-icon icon-violet"><i class="bi bi-pencil-square"></i></span>
        Edit Student
    </h1>
    <a href="{{ url_for('students') }}" class="btn btn-outline-primary">
        <i class="bi bi-arrow-left me-1"></i>Back to Students
    </a>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Roll No <span class="text-danger">*</span></label>
                <input type="text" name="roll_no" value="{{ student.roll_no }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="name" value="{{ student.name }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" name="email" value="{{ student.email }}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" value="{{ student.phone or '' }}" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="Male"   {% if student.gender == 'Male'   %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other"  {% if student.gender == 'Other'  %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="date_of_birth" value="{{ student.date_of_birth or '' }}" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Semester <span class="text-danger">*</span></label>
                <input type="number" name="semester" value="{{ student.semester }}" class="form-control" min="1" max="8" required>
            </div>
            <div class="col-12">
                <label class="form-label">Department</label>
                <select name="department_id" class="form-select">
                    {% for dept in departments %}
                    <option value="{{ dept.department_id }}"
                        {% if dept.department_id == student.department_id %}selected{% endif %}>
                        {{ dept.department_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="3">{{ student.address or '' }}</textarea>
            </div>
            <div class="col-12 d-flex gap-3">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="bi bi-check-circle me-1"></i>Update Student
                </button>
                <a href="{{ url_for('students') }}" class="btn btn-outline-primary btn-lg px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
